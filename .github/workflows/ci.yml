# CI workflow: runs the server tests and the client lint and build on every push and pull request.
#
# GitHub starts a fresh Linux machine, installs everything from scratch, and runs the checks.
# A red X on a commit means something broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest

    # A real PostgreSQL database for the tests, running in a container next to the job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres # throwaway password: this database only lives for this run
        ports:
          - 5432:5432
        # Wait until PostgreSQL is accepting connections before the steps start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      # The tests create this database themselves (see server/test/globalSetup.js).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resolveit_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci # like npm install, but installs exactly what package-lock.json says

      - name: Run tests
        run: npm test

  client:
    name: Client lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
