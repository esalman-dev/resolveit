<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResolveIT · IT help that fixes itself first</title>
    <!-- What search results and shared links show. The address and image must be the full live
         address: sites that build link previews don't know which site the page came from. -->
    <meta name="description" content="An IT help desk that tries safe, AI-guided fixes first, then opens a ticket with everything a technician needs. Try it as a user, technician or admin." />
    <link rel="canonical" href="https://resolveit-helpdesk.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ResolveIT" />
    <meta property="og:title" content="ResolveIT · IT help that fixes itself first" />
    <meta property="og:description" content="An IT help desk that tries safe, AI-guided fixes first, then opens a ticket with everything a technician needs. Try it as a user, technician or admin." />
    <meta property="og:url" content="https://resolveit-helpdesk.vercel.app/" />
    <meta property="og:image" content="https://resolveit-helpdesk.vercel.app/preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="760" />
    <meta property="og:image:alt" content="The ResolveIT home page: Fix it before it's a ticket, with buttons to try the demo" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Sets light or dark mode before anything is drawn, so a dark-mode visitor never sees a
         white flash while the app loads. Note: a short copy of resolveTheme in
         src/lib/theme.js (same storage key); keep the two in sync. -->
    <script>
      try {
        var choice = localStorage.getItem('resolveit_theme')
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        // Storage blocked: the app sets the theme itself a moment later.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
